# Copy to config.yaml and edit. config.yaml is gitignored - your real name,
# address and mailbox belong there, never in this file.
#
# Passwords are NEVER stored in either file - only the name of an environment
# variable that holds one.
#
# Set up for personal outreach from a single Gmail account: internship
# enquiries, not marketing. See README.md for what changes if you ever point
# this at commercial email.

identity:
  from_name: "Your Name"
  company: ""

  # No compliance footer. This is person-to-person mail - an internship
  # enquiry is not advertising a product, so CAN-SPAM's address and opt-out
  # requirements do not apply, and bolting them onto a personal note makes it
  # read as a mass mailing. Set to "full" only for marketing email.
  footer: none

  # Merge fields available in every template, so you don't repeat them in
  # every CSV row. A CSV column with the same name overrides these.
  vars:
    my_name: "Your Name"
    my_first_name: "Your"

    my_status: "a third-year CSE undergrad"
    university: "Your University"

    # Host the resume somewhere with a stable link - GitHub Pages, a personal
    # domain, or Drive set to "anyone with the link". A link beats an
    # attachment: attachments from unknown senders get filtered more often,
    # and a Drive link tells you if anyone actually opened it.
    resume_url: "https://yoursite.example/resume.pdf"
    portfolio: "https://github.com/yourhandle"
    linkedin: "https://linkedin.com/in/yourhandle"

    # When you can start. `timing` reads inside a sentence, `timing_short`
    # goes in subject lines. Keep them consistent with each other.
    #   immediate  -> "starting immediately"   / "immediate start"
    #   future     -> "for summer 2027"        / "summer 2027"
    timing: "for summer 2027"
    timing_short: "summer 2027"
    availability: "free from May, full-time, can relocate"

    # What you want to be hired to do. This lands in subject lines, so it has
    # to be ONE thing - a list like "AI engineering, backend engineering"
    # reads badly and weakens the subject. Your second area is covered by the
    # project detail anyway.
    focus: "AI engineering"

    # Your strongest project. This and the line below do more work than
    # anything else in the email - "built a chatbot" is worth nothing, a
    # number gets a reply. Swap per campaign: a fintech should hear about your
    # fintech project, a health company about the health one.
    my_project: "a short phrase naming your strongest project"

    # Phrased to read correctly after both "where I ..." and a bullet dash,
    # since the sequences use it both ways. Start with a past-tense verb.
    my_project_detail: >-
      built the thing, and here is the number that proves it worked - a
      percentage, a latency, an API count, a user count

    # Used by the recruiters sequence. One line, strongest signal first.
    # Avoid the word "winner" - it reads as a spam trigger, and a placement
    # like "2nd of 200+" is the harder number anyway.
    credential: >-
      your title or role, your best competitive placement, and the domains
      you have shipped in


sending:
  timezone: "Asia/Kolkata"

  # This window is in YOUR timezone but should land in your TARGET's morning,
  # which is when replies happen. Currently set for Indian companies.
  #
  #   India        09:15 - 12:00
  #   UK / Europe  13:30 - 16:30
  #   US East      18:30 - 21:30
  #   US West      21:30 - 23:45
  #
  # Pick one region per campaign rather than covering all of them.
  window_start: "09:15"
  window_end: "12:00"
  days: [mon, tue, wed, thu, fri]

  min_gap_seconds: 300
  max_gap_seconds: 1500
  max_per_tick: 2


warmup:
  # An established personal Gmail is already warm, so this is not about
  # reputation. It is a blast radius limit: if the copy has a mistake in it,
  # you find out after 8 emails, not 200.
  enabled: true
  start_cap: 8
  increment_per_day: 2
  max_cap: 20             # do not raise this on a personal Gmail


tracking:
  # Leave off. On personal outreach a tracking pixel is unreliable and looks
  # bad if the recipient notices it.
  open_tracking: false
  base_url: ""


paths:
  db: coldmailer.db
  sequences: sequences
  suppression: suppression.txt


# ---------------------------------------------------------------------------
# One mailbox: your own Gmail.
#
# No secondary domains, no Google Workspace, no SPF/DKIM/DMARC to configure -
# Google already handles authentication for gmail.com, and an established
# account has real sending history, which is worth more than any new domain.
#
# Generate an App Password: myaccount.google.com > Security > 2-Step
# Verification > App passwords. Requires 2FA. Then:
#   $env:MB1_PASSWORD = "abcd efgh ijkl mnop"
# ---------------------------------------------------------------------------
mailboxes:
  - id: personal
    email: "you@gmail.com"
    from_name: "Your Name"
    username: "you@gmail.com"
    password_env: MB1_PASSWORD
    smtp_host: smtp.gmail.com
    smtp_port: 587
    imap_host: imap.gmail.com
    imap_port: 993
    daily_cap: 20
    enabled: true


# ---------------------------------------------------------------------------
# If you ever use this for commercial marketing instead, three things change:
#
#   identity.footer: full          + physical_address + unsubscribe_mailto
#   mailboxes:                     secondary domains, never your primary
#   warmup.max_cap:                still 40 max per mailbox; scale by adding
#                                  mailboxes, not by raising the cap
#
# See README.md. Different rules, different risk.
# ---------------------------------------------------------------------------
