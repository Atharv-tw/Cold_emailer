# Copy to config.yaml and edit. config.yaml is gitignored.
# Passwords are NEVER stored here - only the name of an environment variable.
#
# This example is set up for personal outreach from a single Gmail account:
# internship and research enquiries, not marketing. See the bottom of the file
# for what changes if you ever use this for commercial email.

identity:
  from_name: "Shivanshu Pandey"
  company: ""

  # No compliance footer. This is person-to-person mail - a job enquiry is not
  # advertising a product, so CAN-SPAM's address and opt-out requirements do
  # not apply, and bolting them onto a personal note makes it read as a mass
  # mailing. Set this to "full" only if you switch to marketing email.
  footer: none

  # Merge fields available in every template, so you don't repeat them in
  # every CSV row. A CSV column with the same name overrides these.
  vars:
    my_name: "Shivanshu Pandey"
    my_first_name: "Shivanshu"
    my_status: "a third-year CS undergrad"
    university: "Your University"

    # Host the resume somewhere with a stable link. A link beats an attachment:
    # attachments from unknown senders get filtered more often.
    resume_url: "https://yoursite.com/resume.pdf"
    portfolio: "https://github.com/yourhandle"

    season: "summer"
    year: "2027"
    availability: "free from May, full-time, can relocate"
    focus: "ML"

    # Your strongest project. Keep it concrete and quantified - this is the
    # single line doing the most work in the whole email.
    my_project: "a retrieval pipeline for 400k support tickets"
    my_project_detail: >-
      fine-tuned a small embedding model that beat off-the-shelf ada-002 by
      11 points on recall@10


sending:
  timezone: "Asia/Kolkata"

  # Set this to your TARGET's working hours, not yours. For US companies from
  # India that means late evening IST; for UK, early evening.
  window_start: "09:15"
  window_end: "17:30"
  days: [mon, tue, wed, thu, fri]

  # Tue-Thu mornings get the best response. Avoid Monday morning and Friday
  # afternoon by trimming `days` if you want to be strict about it.

  min_gap_seconds: 300
  max_gap_seconds: 1500
  max_per_tick: 2


warmup:
  # Your Gmail is already warm - years of real use - so this is not about
  # reputation. It is a blast radius limit: if your copy has a mistake in it,
  # you find out after 8 emails, not 200.
  enabled: true
  start_cap: 8
  increment_per_day: 2
  max_cap: 20             # do not raise this on a personal Gmail


tracking:
  # Leave off. On personal outreach a tracking pixel is both unreliable and
  # slightly grubby if the recipient notices it.
  open_tracking: false
  base_url: ""


paths:
  db: coldmailer.db
  sequences: sequences
  suppression: suppression.txt


# ---------------------------------------------------------------------------
# One mailbox: your own Gmail.
#
# No secondary domains, no Google Workspace, no SPF/DKIM/DMARC to configure -
# Google already handles authentication for gmail.com, and your account has
# real sending history, which is worth more than any new domain could be.
#
# Generate an App Password: myaccount.google.com > Security > 2-Step
# Verification > App passwords. Requires 2FA to be on. Then:
#   $env:MB1_PASSWORD = "abcd efgh ijkl mnop"
# ---------------------------------------------------------------------------
mailboxes:
  - id: personal
    email: "shivanshup1@gmail.com"
    from_name: "Shivanshu Pandey"
    username: "shivanshup1@gmail.com"
    password_env: MB1_PASSWORD
    smtp_host: smtp.gmail.com
    smtp_port: 587
    imap_host: imap.gmail.com
    imap_port: 993
    daily_cap: 20
    enabled: true


# ---------------------------------------------------------------------------
# If you ever use this for commercial marketing instead, three things change:
#
#   identity.footer: full          + physical_address + unsubscribe_mailto
#   mailboxes:                     secondary domains, never your primary
#   warmup.max_cap:                still 40 max per mailbox; scale by adding
#                                  mailboxes, not by raising the cap
#
# See README.md. Different rules, different risk.
# ---------------------------------------------------------------------------
