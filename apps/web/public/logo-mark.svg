<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Outreach">
  <title>Outreach</title>
  <!-- Mark only: the lime disc from Logo() in app/desktop/page.tsx.
       32x32 viewBox matches the h-8 w-8 span it replaces, so it drops in at
       any size. Colours are the lime and ink custom properties from
       globals.css, inlined because an SVG used as a favicon or an img src
       cannot see the app's CSS variables. (Naming those properties with
       their leading dashes would put a double hyphen in this comment, which
       is malformed XML and stops the file rendering at all.) -->
  <circle cx="16" cy="16" r="16" fill="#c6ef4e"/>
  <!-- The "O" as geometry rather than <text>. Space Grotesk is loaded from
       Google Fonts, so there is no local file to outline against, and a text
       node would silently fall back to Inter (or system-ui) anywhere the
       webfont is absent - favicons, README images, email. A ring is stable
       everywhere and close to Space Grotesk Bold's near-circular O.
       Outer diameter 10 = the cap height of the 14px text it replaces. -->
  <circle cx="16" cy="16" r="3.9" fill="none" stroke="#000000" stroke-width="2.2"/>
</svg>
