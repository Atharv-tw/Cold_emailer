<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 148 32" width="148" height="32" role="img" aria-label="Outreach">
  <title>Outreach</title>
  <!-- Full lockup: mark + wordmark, matching Logo() in app/desktop/page.tsx.
       The 10px gap between them is the gap-2.5 on the flex row there. -->
  <circle cx="16" cy="16" r="16" fill="#c6ef4e"/>
  <circle cx="16" cy="16" r="3.9" fill="none" stroke="#000000" stroke-width="2.2"/>

  <!-- The wordmark stays a text node on purpose: unlike the single "O" of the
       mark, "Outreach" cannot be faked with geometry, and outlining it needs
       the Space Grotesk file this repo does not vendor. In the app the
       webfont is loaded and this renders exactly as the component does;
       standalone it falls back to Inter, then system-ui.
       17px / 700 / -0.02em tracking are lifted from the component. -->
  <text x="42" y="16"
        font-family="'Space Grotesk','Inter',system-ui,sans-serif"
        font-size="17" font-weight="700" letter-spacing="-0.34"
        fill="#0a0a0a" dominant-baseline="central">Outreach</text>
</svg>
