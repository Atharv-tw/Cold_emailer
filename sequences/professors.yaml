name: professors
description: >
  For research internships. Completely different rules from industry outreach.

  A professor can tell within one sentence whether you have actually read the
  paper. Generic mail gets deleted instantly - they receive dozens a week from
  students who mail-merged the title and nothing else. The `finding` and
  `question` fields are not optional flavour; they are the entire email.

  Do not run this at volume. Ten genuinely researched emails will beat two
  hundred templated ones, and this is the one audience where getting caught
  mass-mailing actively damages your name in a small field.

  Two touches, with a long gap. Academics are slow.

stop_on_reply: true

steps:
  # ---------------------------------------------------------------- touch 1
  - id: 1
    delay_business_days: 0
    subject: "{{paper_short}} — question from a student at {{university}}"
    body: |
      Dear Professor {{last_name}},

      I'm {{my_name}}, {{my_status}} at {{university}}.

      I read {{paper}}, and {{finding}}.

      {{question}}

      My background: {{my_project}}, where I {{my_project_detail}}. Relevant coursework in {{coursework|linear algebra, probability and deep learning}}.

      I'm looking for a research internship {{timing}} and would be glad to work on {{direction|whatever's most useful to the group, including the unglamorous parts}}. {{availability}}.

      CV: {{resume_url}}

      Thank you for your time,
      {{my_name}}

  # ---------------------------------------------------------------- touch 2
  - id: 2
    delay_business_days: 10
    body: |
      Dear Professor {{last_name}},

      Following up briefly on the note below — I know term is busy.

      If your group isn't taking students this cycle, or if there's a formal application route I should use instead, I'd be grateful to know either way.

      Thank you,
      {{my_name}}
