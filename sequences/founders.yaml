name: founders
description: >
  To founders and CTOs at small startups. One person decides, so you get a
  fast yes or no. Many have no formal internship program at all, which works
  in your favour - you are not competing against a queue of 4,000 portal
  applications, you are proposing something that did not exist.

  Lead with what you can do for them, not what you want. Three touches,
  because founders genuinely do lose emails.

stop_on_reply: true

steps:
  # ---------------------------------------------------------------- touch 1
  - id: 1
    delay_business_days: 0
    subject: "{{focus}} intern for {{company}} — {{timing_short}}"
    body: |
      Hi {{first_name}},

      I'm {{my_name}}, {{my_status}} at {{university}}. {{specific}} — {{reaction|which is why I'm writing}}.

      What I've built: {{my_project}}, where I {{my_project_detail}}.

      I'm looking for an {{focus}} internship {{timing}}, and I'd rather work on whatever's actually blocking you than a curated side project. {{availability}}.

      {{resume_url}}

      Worth 15 minutes?

      {{my_first_name}}

  # ---------------------------------------------------------------- touch 2
  - id: 2
    delay_business_days: 5
    body: |
      Hi {{first_name}},

      Following up on the below.

      To make it concrete: give me {{concrete_offer|two weeks}} and I'd {{concrete_deliverable|ship a working prototype of whatever's furthest down your backlog}}. Happy to do a paid trial task first so you're not taking my word for it.

      {{my_first_name}}

  # ---------------------------------------------------------------- touch 3
  - id: 3
    delay_business_days: 8
    body: |
      Hi {{first_name}},

      Last one from me — I'll stop after this.

      If the timing's wrong now but might not be later, say so and I'll check back in a few months rather than keep emailing.

      {{my_first_name}}
